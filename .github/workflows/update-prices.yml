name: Update prices

# Checks every store listed on the sheet's Offers tab and publishes a snapshot to the
# `data` branch, which the site reads (ISR, every 15 min). Problems are reported in a
# GitHub issue labelled `price-tracker`.

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch:           # "Run workflow" button for an immediate refresh

permissions:
  contents: write
  issues: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Get previous snapshot
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          if git fetch --depth=1 origin data 2>/dev/null; then
            git --work-tree="$RUNNER_TEMP/prev" checkout FETCH_HEAD -- .
          fi

      - name: Check prices
        env:
          SHEET_PRODUCTS_CSV_URL: ${{ vars.SHEET_PRODUCTS_CSV_URL }}
          SHEET_OFFERS_CSV_URL: ${{ vars.SHEET_OFFERS_CSV_URL }}
          AMAZON_CREDENTIAL_ID: ${{ secrets.AMAZON_CREDENTIAL_ID }}
          AMAZON_CREDENTIAL_SECRET: ${{ secrets.AMAZON_CREDENTIAL_SECRET }}
          AMAZON_CREDENTIAL_VERSION: ${{ vars.AMAZON_CREDENTIAL_VERSION }}
          AMAZON_PARTNER_TAG: ${{ vars.AMAZON_PARTNER_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-prices.mjs --prev "$RUNNER_TEMP/prev" --out "$RUNNER_TEMP/out"

      # One commit, force-pushed: the branch holds only the latest files (history.csv
      # carries the price history), so it never grows.
      - name: Publish to data branch
        working-directory: ${{ runner.temp }}/out
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b data
          git config user.name "price-checker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Price snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
